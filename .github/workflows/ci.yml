name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ── Conventional commit enforcement (guards release-please version bumps) ──
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx commitlint --from HEAD~1 --to HEAD --verbose
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --exit-code 1

  # ── Schema validation (Prisma, free — replaces Atlas Pro schema lint) ──────
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

  # ── API contract breaking-change gate (oasdiff) ───────────────────────────────
  contract-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare base spec
        id: base
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$BASE_TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git show "$BASE_TAG:openapi.json" > /tmp/openapi.base.json
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check API contract for breaking changes
        if: steps.base.outputs.skip != 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: /tmp/openapi.base.json
          revision: openapi.json
          fail-on: ERR

  # ── Unified quality gate (Dagger) — mirrors `test`; keep `test` until parity ──
  dagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.21.8 BIN_DIR=$HOME/.local/bin sh
      - name: Run unified quality gate
        run: $HOME/.local/bin/dagger call -m ci check --src .

  # ── Dependency vulnerability audit (non-blocking: 3 high transitive advisories) ─
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ── Code coverage gate (per-file thresholds in vitest.config.ts) ────────────
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run coverage (enforces per-file thresholds)
        run: npm run test:coverage

  # ── Real-Postgres smoke: money/tenant/idempotency invariants a mock can't catch ──
  db-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corpopay
          POSTGRES_PASSWORD: corpopay
          POSTGRES_DB: corpopay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corpopay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://corpopay:corpopay@localhost:5432/corpopay?schema=public
      DIRECT_URL: postgresql://corpopay:corpopay@localhost:5432/corpopay?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run DB smoke tests
        run: npm run test:db
  # ── Dead code / unused dependency gate (Knip) ───────────────────────────────
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Knip
        run: npm run knip

  # ── Dependency vulnerability scan (OSV-Scanner, lockfiles; advisory) ────────
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      fail-on-vuln: false
    permissions:
      actions: read
      contents: read
      security-events: write

  # ── Custom SAST rules (Semgrep, non-blocking: advisory) ─────────────────────
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --config .semgrep.yml

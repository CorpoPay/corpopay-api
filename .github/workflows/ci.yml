name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --exit-code 1

  # ── Schema quality (Atlas Pro) — skipped until ATLAS_TOKEN is configured ──────
  schema-lint:
    runs-on: ubuntu-latest
    if: ${{ secrets.ATLAS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Atlas
        run: curl -sSfL https://atlasgo.sh | sh
      - name: Authenticate to Atlas Cloud
        run: atlas login --token "${{ secrets.ATLAS_TOKEN }}"
      - name: Lint Prisma schema
        run: atlas schema lint --dev-url "docker://postgres/16" --url "file://prisma/schema.prisma"

  # ── API contract diff (Bump.sh) — skipped until BUMP_TOKEN + BUMP_DOC_SLUG ────
  contract-diff:
    runs-on: ubuntu-latest
    if: ${{ secrets.BUMP_TOKEN != '' && secrets.BUMP_DOC_SLUG != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check API contract for breaking changes
        uses: bump-sh/github-action@v1
        with:
          doc: ${{ secrets.BUMP_DOC_SLUG }}
          token: ${{ secrets.BUMP_TOKEN }}
          command: diff
          file: openapi.json

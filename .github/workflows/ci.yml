name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --exit-code 1

  # ── Schema validation (Prisma, free — replaces Atlas Pro schema lint) ──────
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

  # ── API contract breaking-change gate (openapi-diff, free — replaces Bump.sh) ─
  contract-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check API contract for breaking changes
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$BASE_TAG" ]; then
            echo "No previous release tag; skipping breaking-change check."
            exit 0
          fi
          git show "$BASE_TAG:openapi.json" > /tmp/openapi.base.json
          npx --yes openapi-diff /tmp/openapi.base.json openapi.json

  # ── Unified quality gate (Dagger) — mirrors `test`; keep `test` until parity ──
  dagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
      - name: Run unified quality gate
        run: $HOME/.local/bin/dagger call -m ci check --src .

  # ── Dependency vulnerability audit (non-blocking: 3 high transitive advisories) ─
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ── Code coverage gate (per-file thresholds in vitest.config.ts) ────────────
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage (enforces per-file thresholds)
        run: npm run test:coverage

name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      target:
        description: API base URL to load test (e.g. https://api.example.com)
        required: true
        default: http://localhost:4000

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin

      - name: Run load test
        run: k6 run k6/checkout.js
        env:
          API_BASE_URL: ${{ github.event.inputs.target }}

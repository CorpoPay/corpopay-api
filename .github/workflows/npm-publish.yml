name: npm-publish

on:
  push:
    tags:
      - 'corpopay-api-v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # actions/setup-node v4 writes a placeholder stub into .npmrc
      # (_authToken=XXXXX-XXXXX-XXXXX-XXXXX) when registry-url is set. Stripping
      # it lets npm fall back to the OIDC trusted-publishing exchange instead of
      # attempting to authenticate with a bogus token.
      - name: Strip placeholder npm token
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build contract package
        working-directory: contract
        run: npm run build

      - name: Publish to npm
        working-directory: contract
        run: npm publish --tag "${{ inputs.dist_tag || 'latest' }}"

name: Bug report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
  - type: input
    id: version
    attributes:
      label: Version / environment
      description: Commit SHA, environment (dev/prod), Node version, etc.

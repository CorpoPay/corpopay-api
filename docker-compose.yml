services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: corpopay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corpopay
      POSTGRES_PASSWORD: corpopay
      POSTGRES_DB: corpopay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpopay"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: corpopay_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Override DB URLs for Docker inter-container networking (local postgres, not Neon)
      DATABASE_URL: "postgresql://corpopay:corpopay@postgres:5432/corpopay?schema=public"
      DIRECT_URL:   "postgresql://corpopay:corpopay@postgres:5432/corpopay?schema=public"
      # Tell Inngest SDK to send events to the local dev server container, not cloud
      INNGEST_BASE_URL: "http://inngest:8288"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    # migrate deploy: safe on every restart (applies pending migrations, never recreates)
    # generate: keeps Prisma client in sync with schema after any new migration
    # seed: idempotent (skips records that already exist)
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma generate &&
             npx tsx prisma/seed.ts &&
             npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Inngest Dev Server ───────────────────────────────────────────────────────
  inngest:
    build:
      context: .
      dockerfile: Dockerfile.inngest
    container_name: corpopay_inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    # --host 0.0.0.0 makes the dashboard accessible from your host browser
    command: dev --host 0.0.0.0 -u http://api:4000/api/inngest
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_node_modules:
